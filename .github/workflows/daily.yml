name: fund-patrol

on:
  schedule:
    - cron: "0 14 * * 1-5"  # 22:00 北京时间，周一至周五（当日净值公布后）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install akshare
      - run: python patrol.py
      - run: |
          git config user.name "fund-patrol-bot"
          git config user.email "bot@users.noreply.github.com"
          git add latest.json history/
          git diff --cached --quiet || git commit -m "patrol $(date -u +%F)"
          git push
